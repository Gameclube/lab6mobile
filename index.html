<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LinguaTalk — Вход</title>
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <header class="auth-header">
    <div class="logo">
      <span class="logo__icon">L</span>
      <span class="logo__text">Lingua Talk</span>
    </div>
    <a href="#" class="auth-header__link">Уже в сети</a>
  </header>

  <main class="auth-main">
    <section class="hero">
      <h1 class="hero__title">Говорите свободно.<br>Учитесь с интересом.</h1>
      <p class="hero__subtitle">Персональные уроки, живые разговоры и заметный прогресс каждый день.</p>
    </section>

    <section class="auth-card">
      <h2 class="auth-card__title">Войти в аккаунт</h2>

      <form class="auth-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-input" placeholder="anna@example.ru" required>
          <span class="form-hint">Используйте email, указанный при регистрации</span>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Пароль</label>
          <div class="form-input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            <button type="button" class="form-toggle" aria-label="Показать пароль">👁</button>
          </div>
          <span class="form-hint">Не менее 8 символов</span>
        </div>

        <a href="#" class="form-link">Забыли пароль?</a>

        <button type="submit" class="btn btn--primary">Войти</button>
      </form>

      <div class="divider">или продолжить с</div>

      <div class="social-buttons">
        <button type="button" class="btn btn--social">
          <span class="social-icon">G</span> Google
        </button>
        <button type="button" class="btn btn--social">
          <span class="social-icon"></span> Apple
        </button>
      </div>

      <p class="auth-footer">
        Нет аккаунта? <a href="#" class="form-link">Зарегистрироваться</a>
      </p>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
